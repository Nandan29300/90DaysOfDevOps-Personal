services:

  # =========================
  # PostgreSQL
  # =========================

  db:
    image: postgres:16-alpine

    container_name: dockerbuddy-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - dockerbuddy-postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - dockerbuddy-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================
  # Backend
  # =========================

  backend:
    image: nandan56/dockerbuddy-backend:v1.0.0

    container_name: dockerbuddy-backend

    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "5000:5000"

    networks:
      - dockerbuddy-network


  # =========================
  # Frontend
  # =========================

  frontend:
    image: nandan56/dockerbuddy-frontend:v1.0.0

    container_name: dockerbuddy-frontend

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - dockerbuddy-network


# =========================
# Volumes
# =========================

volumes:
  dockerbuddy-postgres-data:


# =========================
# Network
# =========================

networks:
  dockerbuddy-network:
    driver: bridge
