name: Day 44 - Run Real Script

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x scripts/system-info.sh

      - name: Run system info script
        run: ./scripts/system-info.sh
