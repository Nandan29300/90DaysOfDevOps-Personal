
name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        description: Docker Hub image name
        required: true
        type: string

      tag:
        description: Docker image tag
        required: true
        type: string

    secrets:
      docker_username:
        required: true

      docker_token:
        required: true

    outputs:
      image_url:
        description: Published Docker image URL
        value: ${{ jobs.docker.outputs.image_url }}

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.image.outputs.image_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Short SHA
        id: short-sha
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set image details
        id: image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "image_url=docker.io/${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          TAG: ${{ inputs.tag }}
          SHORT_SHA: ${{ steps.short-sha.outputs.sha }}
        run: |
          docker build \
            -t "${IMAGE_NAME}:${TAG}" \
            -t "${IMAGE_NAME}:sha-${SHORT_SHA}" \
            .

      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ inputs.image_name }}:${{ inputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      - name: Push Docker Image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          TAG: ${{ inputs.tag }}
          SHORT_SHA: ${{ steps.short-sha.outputs.sha }}
        run: |
          docker push "${IMAGE_NAME}:${TAG}"
          docker push "${IMAGE_NAME}:sha-${SHORT_SHA}"
