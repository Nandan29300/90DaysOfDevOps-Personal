name: Python OS Matrix

on:
  push:

jobs:
  test-matrix:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print environment
        run: |
          echo "Operating System: ${{ matrix.os }}"
          echo "Python Version: ${{ matrix.python-version }}"
          python --version


