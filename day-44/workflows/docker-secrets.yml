name: Day 44 - Secrets as Environment Variables

on:
  workflow_dispatch:

jobs:
  use-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Use secret as environment variable
        env:
          MY_SECRET_MESSAGE: ${{ secrets.MY_SECRET_MESSAGE }}
        run: |
          if [ -n "$MY_SECRET_MESSAGE" ]; then
            echo "Secret successfully passed as an environment variable."
          else
            echo "Secret is not available."
            exit 1
          fi

      - name: Verify Docker secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_TOKEN" ]; then
            echo "Docker credentials are configured."
          else
            echo "Docker credentials are missing."
            exit 1
          fi
