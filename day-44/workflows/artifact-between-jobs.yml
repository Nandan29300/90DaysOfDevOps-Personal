name: Day 44 - Artifact Between Jobs

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate file
        run: |
          mkdir -p output

          echo "Hello from Job 1!" > output/job1-output.txt
          echo "This file was generated by Job 1." >> output/job1-output.txt

      - name: Display generated file
        run: |
          cat output/job1-output.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: job1-output
          path: output/job1-output.txt

  consume:
    runs-on: ubuntu-latest
    needs: generate

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: job1-output
          path: downloaded

      - name: Read artifact
        run: |
          echo "Contents downloaded from Job 1:"
          cat downloaded/job1-output.txt
